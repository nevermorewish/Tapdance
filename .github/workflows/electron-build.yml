name: Build and Upload Electron Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA). Leave empty for the current ref.'
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-windows:
    name: Windows package (${{ matrix.brand }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        brand:
          - huanxing
          - fengchi
          - frogclaw

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          TAPDANCE_SKIP_POSTINSTALL_NATIVE_CHECK: '1'

      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run version:check-tag -- ${{ github.ref_name }}

      - name: Ensure Electron native dependencies
        run: node scripts/ensure-electron-native-modules.mjs

      - name: Generate active brand configuration
        env:
          BRAND: ${{ matrix.brand }}
        run: node scripts/generate-brand.mjs

      - name: Verify active brand and video models
        env:
          BRAND: ${{ matrix.brand }}
        shell: pwsh
        run: |
          $brand = Get-Content "brands/$env:BRAND.json" -Raw | ConvertFrom-Json
          if ($brand.id -ne $env:BRAND) { throw "Brand id mismatch: $($brand.id)" }
          if ($brand.videoModel.Count -ne 3) { throw "Expected exactly 3 video models for $env:BRAND" }
          $active = Get-Content src/config/activeBrand.ts -Raw
          if (!$active.Contains("$env:BRAND")) { throw "Active brand was not generated for $env:BRAND" }
          Write-Host "Brand $env:BRAND uses video models: $($brand.videoModel -join ', ')"

      - name: Build Windows installer
        env:
          BRAND: ${{ matrix.brand }}
        run: npm run pack:win:single -- --config.directories.output=release/${{ matrix.brand }}

      - name: Verify Windows artifacts
        env:
          BRAND: ${{ matrix.brand }}
        shell: pwsh
        run: |
          $source = "release/$env:BRAND"
          $installers = Get-ChildItem $source -Filter '*.exe' -File
          if ($installers.Count -eq 0) { throw "No Windows installer found under $source" }
          $updateMetadata = Get-ChildItem $source -Filter 'latest.yml' -File
          if ($updateMetadata.Count -eq 0) { throw "No latest.yml found under $source" }
          $installers | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize

      - name: Upload package to Volcengine TOS
        env:
          BRAND: ${{ matrix.brand }}
        run: node scripts/upload-tos.mjs release/${{ matrix.brand }}

      - name: Upload GitHub workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-${{ matrix.brand }}
          path: |
            release/${{ matrix.brand }}/*.exe
            release/${{ matrix.brand }}/*.blockmap
            release/${{ matrix.brand }}/*.yml
            !release/${{ matrix.brand }}/builder-debug.yml
          if-no-files-found: error
          retention-days: 7
